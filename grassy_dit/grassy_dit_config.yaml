# GRASSY-DiT Training Configuration
# Usage:
#   python -m grassy_dit.train --config grassy_dit_config.yaml
#   python -m grassy_dit.train --config grassy_dit_config.yaml --override training.epochs=50

# Dataset configuration
dataset:
  name: "moses"
  data_dir: "grassy_dit/data/moses"
  csv_file: "molecules.csv"
  smiles_col: "smiles"
  scatter_file: "scattering_moments.npy"
  seed: 42
  # Validation data (optional - leave null to use train loss for checkpointing)
  val_data_dir: null
  val_csv_file: null
  val_scatter_file: null
  val_every_n_epochs: 1

scattering:
  J: 4
  num_moments: 4

# Model architecture
model:
  max_node: 50
  hidden_size: 384
  num_layer: 12
  num_head: 16  # Note: currently forced to have same number of cross-attention heads as self-attention heads
  mlp_ratio: 4.0

# Training configuration
training:
  epochs: 50
  batch_size: 128
  learning_rate: 1.0e-4

# Consistency loss configuration (Gumbel-Softmax)
# Enforces that generated molecules match their conditioning scattering moments
consistency:
  enabled: false  # Set to true to enable consistency loss
  weight: 0.1  # Weight for consistency loss (lw_consistency)
  temperature: 1.0  # Initial Gumbel-Softmax temperature
  temperature_min: 0.1  # Final temperature (annealed during generation)
  num_generation_steps: 50  # Number of diffusion steps for generation (fewer = faster but lower quality)
  every_n_steps: 10  # Compute consistency loss every N training steps (saves compute)
  start_epoch: 5  # Start using consistency loss after this epoch (let model warm up first)

# Checkpoint configuration
checkpoint:
  save_dir: "./checkpoints/moses"
  save_best: true
  save_every_n_epochs: 2
  resume_from: null  # Path to checkpoint to resume from

# Hardware configuration
hardware:
  device: "auto"  # "auto", "cuda", "cpu"
  num_workers: 4
  pin_memory: true

# Logging configuration
logging:
  wandb:
    enabled: true
    project: "GRASSY-DiT"
    entity: "grassy"
    name: null  # Auto-generated if null
  verbose: true