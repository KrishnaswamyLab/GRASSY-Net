# GRASSY-DiT Training Configuration
# Usage:
#   python -m grassy_dit.train --config grassy_dit_config.yaml
#   python -m grassy_dit.train --config grassy_dit_config.yaml --override training.epochs=50

# Dataset configuration
dataset:
  name: "jbcd"
  data_dir: "grassy_dit/data/data_jbcd"
  csv_file: "molecules.csv"
  smiles_col: "smiles"
  scatter_file: "scattering_moments.npy"
  seed: 42
  
  # Validation data (optional - leave null to use train loss for checkpointing)
  val_data_dir: grassy_dit/data/data_jbcd/val
  val_csv_file: null
  val_scatter_file: null
  val_every_n_epochs: 5

scattering:
  J: 4
  num_moments: 4

# Model architecture
model:
  max_node: 18
  hidden_size: 256
  num_layer: 12
  num_head: 16  # Note: currently forced to have same number of cross-attention heads as self-attention heads
  mlp_ratio: 4.0

# Training configuration
training:
  epochs: 2000
  batch_size: 16
  learning_rate: 1.0e-4

# Checkpoint configuration
checkpoint:
  save_dir: "./checkpoints/zinc/jbcd"
  save_best: true
  save_every_n_epochs: 2
  resume_from: null  # Path to checkpoint to resume from

# Hardware configuration
hardware:
  device: "auto"  # "auto", "cuda", "cpu"
  num_workers: 4
  pin_memory: true

# Logging configuration
logging:
  wandb:
    enabled: true
    project: "GRASSY-DiT"
    entity: "grassy"
    name: null  # Auto-generated if null
  verbose: true