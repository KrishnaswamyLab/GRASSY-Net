# GRASSY Training Configuration with Fixed Scattering Transform
#
# This config uses the non-learnable GraphScatteringTransform instead of
# a pre-trained scattering model. The scattering coefficients are computed
# deterministically based on graph structure.

# Dataset settings
dataset:
  name: "FBAB"
  path: "datasets/ZINC_tranches/FBAB/FBAB.npy"
  stats_path: "datasets/ZINC_tranches/FBAB/FBAB_stats.npy"

  # Data splits
  train_pct: 80    # 80% for training
  val_pct: 10      # 10% for validation
  test_pct: 10     # 10% for testing

  seed: 42  # Random seed for reproducibility

# Fixed Scattering Transform settings
scattering:
  J: 4              # Number of wavelet scales
  num_moments: 4    # Statistical moments (1=mean, 2=+var, 3=+skew, 4=+kurtosis)
  precomputed_path: "grassy_dit/data_FBAB/scattering_moments.npy"
  # Output dimension = num_node_features * (1 + J + J*(J-1)/2) * num_moments
  # For 16 features, J=4, moments=4: 16 * 11 * 4 = 704

# Model architecture
model:
  bottle_dim: 32       # Bottleneck dimension (latent space)
  hidden_dim: 128      # Hidden layer dimension
  # input_dim is computed from scattering output

# Training settings
training:
  n_epochs: 100
  batch_size: 64
  learning_rate: 0.001
  num_workers: 4

  # Loss weights
  alpha: 0.01          # Weight for regression loss

# Hardware settings
hardware:
  n_gpus: 1
  accelerator: "auto"  # "auto", "gpu", "cpu", "mps"

# Logging and checkpoints
logging:
  save_dir: "outputs/"
  wandb:
    enabled: true
    entity: "grassy"
    project: "GRASSY-FixedScattering"

  # Checkpoint settings
  checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 1
    save_last: true

# Early stopping (optional - disabled by default)
early_stopping:
  enabled: true
  monitor: "val_loss"
  patience: 10
  min_delta: 0.0
  mode: "min"

# Resume training from checkpoint (optional)
resume_from_checkpoint: null
