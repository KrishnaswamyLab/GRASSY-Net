# GRASSY Training Configuration with Fixed Scattering Transform
#
# This config uses the non-learnable GraphScatteringTransform instead of
# a pre-trained scattering model. The scattering coefficients are computed
# deterministically based on graph structure.

# Dataset settings
dataset:
  name: "BACE"
  train_path: "datasets/BACE_train.npy"
  test_path: "datasets/BACE_test.npy"
  val_path: "datasets/BACE_val.npy"
  stats_path: "datasets/BACE_stats.npy"
  seed: 42  # Random seed for reproducibility

# Fixed Scattering Transform settings
scattering:
  J: 4              # Number of wavelet scales
  num_moments: 4    # Statistical moments (1=mean, 2=+var, 3=+skew, 4=+kurtosis)
  # Output dimension = num_node_features * (1 + J + J*(J-1)/2) * num_moments
  # For 16 features, J=4, moments=4: 16 * 11 * 4 = 704

# Model architecture
model:
  bottle_dim: 32       # Bottleneck dimension (latent space)
  hidden_dim: 128      # Hidden layer dimension

# Training settings
training:
  n_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  num_workers: 4

  # Loss weights
  alpha: 0.01          # Weight for regression loss
  beta: 0.0005         # Weight for KL divergence loss

  # GRASSY version: controls which losses are active
  # Options: "AE+REG", "VAE+REG", "AE", "VAE"
  #   - AE+REG: Autoencoder with regression (no KL loss)
  #   - VAE+REG: Variational autoencoder with regression
  #   - AE: Autoencoder only (no regression, no KL)
  #   - VAE: Variational autoencoder only (no regression)
  grassy_version: "AE+REG"

# Hardware settings
hardware:
  n_gpus: 1
  accelerator: "auto"  # "auto", "gpu", "cpu", "mps"

# Logging and checkpoints
logging:
  save_dir: "outputs/"
  wandb:
    enabled: true
    entity: "grassy"
    project: "GRASSY-FixedScattering"

  # Checkpoint settings
  checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 1
    save_last: true

# Early stopping (optional - disabled by default)
early_stopping:
  enabled: false
  monitor: "val_loss"
  patience: 10
  min_delta: 0.0
  mode: "min"

# Resume training from checkpoint (optional)
resume_from_checkpoint: null
