# GRASSY Training Configuration

# Dataset settings
dataset:
  name: "MOSES"
  path: "datasets/MOSES.npy"
  stats_path: "datasets/MOSES_stats.npy"
  scatter_model_path: "scripts/trained_models/ZINC12K.npy"
  include_ki: false

  # Data splits
  train_size: 10000
  val_size: 1000
  # test_size is computed as: len(dataset) - train_size - val_size

  seed: 42  # Random seed for reproducibility

# Model architecture
model:
  bottle_dim: 32       # Bottleneck dimension (latent space)
  hidden_dim: 128      # Hidden layer dimension
  # input_dim is computed from the dataset

# Training settings
training:
  n_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  num_workers: 4

  # Loss weights
  alpha: 0.01          # Weight for regression loss
  beta: 0.0005         # Weight for KL divergence loss

  # GRASSY version: controls which losses are active
  # Options: "AE+REG", "VAE+REG", "AE", "VAE"
  #   - AE+REG: Autoencoder with regression (no KL loss)
  #   - VAE+REG: Variational autoencoder with regression
  #   - AE: Autoencoder only (no regression, no KL)
  #   - VAE: Variational autoencoder only (no regression)
  grassy_version: "AE+REG"

# Hardware settings
hardware:
  n_gpus: 1
  accelerator: "auto"  # "auto", "gpu", "cpu", "mps"

# Logging and checkpoints
logging:
  save_dir: "scripts/final_logs/"
  wandb:
    enabled: true
    entity: "grassy"
    project: "GRASSY-ZINC12K"


  # Checkpoint settings
  checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 1
    save_last: true

# Early stopping (optional - disabled by default)
early_stopping:
  enabled: false
  monitor: "val_loss"
  patience: 5
  min_delta: 0.0
  mode: "min"

# Resume training from checkpoint (optional)
resume_from_checkpoint: null
