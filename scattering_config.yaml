# Learnable Scattering MLP Training Configuration

# Dataset settings
dataset:
  name: "ZINC12K"
  path: "datasets/ZINC12K.npy"
  stats_path: "datasets/ZINC12K_stats.npy"
  include_ki: false

  # Data splits (proportions, will be normalized)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

  seed: 42  # Random seed for reproducibility

# Model architecture
model:
  # Whether to make scattering wavelets learnable
  trainable_scattering: true
  # Maximum graph size for scattering computation
  max_graph_size: 100
  # Nonlinearity type: "mlp" or "abs"
  #   - "mlp": Use per-wavelet MLPs 
  #   - "abs": Use absolute value
  nonlinearity: "abs"

# Training settings
training:
  max_epochs: 80
  batch_size: 32
  learning_rate: 0.0001  # 1e-4
  num_workers: 0

# Hardware settings
hardware:
  accelerator: "auto"  # "auto", "gpu", "cpu", "mps"

# Logging and checkpoints
logging:
  save_dir: "scripts/final_logs/"
  model_save_dir: "scripts/trained_models/"
  wandb:
    enabled: true
    entity: "grassy"
    project: "GRASSY-Scattering"

# Early stopping
early_stopping:
  enabled: true
  mode: "min"
  patience: 5
  min_delta: 0
  percentage: false
